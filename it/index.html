<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt &mdash; Vibe Coding con Claude</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --indigo: #1A1A2E;
  --purple: #818CF8;
  --purple-light: #a5aef8;
  --purple-bg: #eef0ff;
  --border: #e0e0e4;
  --code-bg: #1e1e2e;
  --code-text: #cdd6f4;
  --success: #34c759;
  --radius: 10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  background: var(--indigo);
  color: #fff;
  padding: 3rem 1.5rem 2.5rem;
  text-align: center;
}

.header h1 {
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
}

.header .subtitle {
  font-size: 1rem;
  color: var(--purple-light);
  font-weight: 400;
  max-width: 480px;
  margin: 0 auto;
}

.header .book-author {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
  margin-top: 0.75rem;
}

.header .book-link {
  margin-top: 0.75rem;
}

.header .book-link a {
  color: var(--purple-light);
  font-size: 0.85rem;
  text-decoration: none;
  border-bottom: 1px solid rgba(165,174,248,0.3);
  transition: border-color 0.15s;
}

.header .book-link a:hover {
  border-color: var(--purple-light);
}

/* Main */
.main {
  max-width: 760px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

/* Chapter accordion */
.chapter {
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 0.75rem;
  border: 1px solid var(--border);
  overflow: hidden;
}

.chapter-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.25rem;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.15s;
}

.chapter-header:hover {
  background: var(--purple-bg);
}

.chapter-header .arrow {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s ease;
  color: var(--purple);
}

.chapter.open .chapter-header .arrow {
  transform: rotate(90deg);
}

.chapter-header .arrow svg {
  width: 14px;
  height: 14px;
}

.chapter-header .ch-number {
  flex-shrink: 0;
  background: var(--indigo);
  color: #fff;
  font-size: 0.75rem;
  font-weight: 600;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chapter-header .ch-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
}

.chapter-body {
  display: none;
  padding: 0 1.25rem 1.25rem;
}

.chapter.open .chapter-body {
  display: block;
}

/* Prompt card */
.prompt-card {
  margin-top: 1rem;
}

.prompt-card:first-child {
  margin-top: 0.5rem;
}

.prompt-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 0.35rem;
  display: flex;
  align-items: baseline;
  gap: 0.4rem;
}

.prompt-label .num {
  color: var(--purple);
  font-weight: 700;
  font-size: 0.8rem;
}

.prompt-block {
  position: relative;
  background: var(--code-bg);
  border-radius: 8px;
  overflow: hidden;
}

.prompt-text {
  display: block;
  padding: 1rem 3.5rem 1rem 1rem;
  color: var(--code-text);
  font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  font-size: 0.82rem;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-x: auto;
}

.copy-btn {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  color: #cdd6f4;
  font-size: 0.72rem;
  font-weight: 500;
  padding: 0.3rem 0.6rem;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  font-family: inherit;
  white-space: nowrap;
}

.copy-btn:hover {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
}

.copy-btn.copied {
  background: var(--success);
  color: #fff;
  border-color: var(--success);
}

/* Footer */
.footer {
  text-align: center;
  padding: 2rem 1rem;
  font-size: 0.78rem;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
  max-width: 760px;
  margin: 0 auto;
}

/* Responsive */
@media (max-width: 600px) {
  .header { padding: 2rem 1rem 1.75rem; }
  .header h1 { font-size: 1.35rem; }
  .header .subtitle { font-size: 0.9rem; }
  .main { padding: 1rem 0.75rem 2rem; }
  .chapter-header { padding: 0.85rem 1rem; }
  .chapter-body { padding: 0 1rem 1rem; }
  .prompt-text { font-size: 0.78rem; padding: 0.85rem 3rem 0.85rem 0.85rem; }
  .chapter-header .ch-title { font-size: 0.88rem; }
}
</style>
</head>

function escapeHtml(str) {
  var d = document.createElement("div");
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(function() {
    var orig = btn.textContent;
    btn.textContent = "Copiato!";
    btn.classList.add("copied");
    setTimeout(function() {
      btn.textContent = orig;
      btn.classList.remove("copied");
    }, 1500);
  }).catch(function() {
    /* Fallback for older browsers */
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch(e) {}
    document.body.removeChild(ta);
    var orig = btn.textContent;
    btn.textContent = "Copiato!";
    btn.classList.add("copied");
    setTimeout(function() {
      btn.textContent = orig;
      btn.classList.remove("copied");
    }, 1500);
  });
}

var arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

function render() {
  var app = document.getElementById("app");
  var html = "";

  for (var c = 0; c < DATA.length; c++) {
    var ch = DATA[c];
    html += '<div class="chapter" data-ch="' + c + '">';
    html += '<div class="chapter-header" onclick="toggleChapter(' + c + ')">';
    html += '<span class="arrow">' + arrowSvg + '</span>';
    html += '<span class="ch-number">' + ch.num + '</span>';
    html += '<span class="ch-title">' + escapeHtml(ch.title) + '</span>';
    html += '</div>';
    html += '<div class="chapter-body">';

    for (var p = 0; p < ch.prompts.length; p++) {
      var pr = ch.prompts[p];
      html += '<div class="prompt-card">';
      html += '<div class="prompt-label"><span class="num">' + pr.id + '.</span> ' + escapeHtml(pr.label) + '</div>';
      html += '<div class="prompt-block">';
      html += '<pre class="prompt-text">' + escapeHtml(pr.text) + '</pre>';
      html += '<button class="copy-btn" data-prompt-id="' + pr.id + '">Copia</button>';
      html += '</div></div>';
    }

    html += '</div></div>';
  }

  app.innerHTML = html;

  /* Attach copy handlers via delegation */
  app.addEventListener("click", function(e) {
    if (e.target.classList.contains("copy-btn")) {
      var id = parseInt(e.target.getAttribute("data-prompt-id"), 10);
      for (var i = 0; i < DATA.length; i++) {
        for (var j = 0; j < DATA[i].prompts.length; j++) {
          if (DATA[i].prompts[j].id === id) {
            copyToClipboard(DATA[i].prompts[j].text, e.target);
            return;
          }
        }
      }
    }
  });
}

function toggleChapter(idx) {
  var el = document.querySelector('.chapter[data-ch="' + idx + '"]');
  if (el) el.classList.toggle("open");
}

render();
</script>
